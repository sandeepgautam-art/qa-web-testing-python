[pytest]
testpaths = tests
# Lets "from pages.login_page import LoginPage" work from the project root
pythonpath = .
addopts = -v --strict-markers
markers =
    smoke: quick checks that the core user journeys are alive
    regression: broader checks re-run after every change
    negative: invalid-input / error-path checks
    validation: required-field and input-validation checks
