; Central configuration - read by utils/config_reader.py.
; Nothing in the framework hard-codes these values.

[application]
base_url = https://www.saucedemo.com/

[browser]
; Only "chrome" is implemented in utils/driver_factory.py
browser = chrome
; true = no visible browser window (useful on servers/CI). Can be overridden
; without editing this file:  HEADLESS=true python3 -m pytest
headless = false

[settings]
; Explicit-wait timeout in seconds
timeout = 10
